name: car_rental
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.1 <4.0.0"

dependencies:
  cached_network_image: ^4.0.0
  cloud_firestore: ^6.10.0
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flex_color_picker: ^4.0.0
  flutter:
    sdk: flutter
  flutter_any_logo: ^1.1.1
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.8
  flutter_polyline_points: ^3.1.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.9
  fluttertoast: ^10.0.0
  font_awesome_flutter: ^11.0.0
  geocoding: ^5.0.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.5.0
  google_maps_widget: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.4
  internet_connection_checker: ^3.0.1
  intl: ^0.20.3
  location: ^10.0.2
  map_location_picker: ^4.0.1
  pull_to_refresh: ^2.0.0
  rename_app: ^1.3.1
  share_plus: ^13.3.0
  shared_preferences: ^2.2.2
  shimmer: ^4.0.0
  url_launcher: ^6.2.2
  uuid: ^4.6.0
  widget_to_marker: ^1.0.4

dev_dependencies:
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  intl_utils: ^2.8.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  color_dark: "#121212"
  image_dark: assets/images/logo.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#121212"

  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/shared/
  filename: assets.dart
  field_prefix: null

flutter_intl:
  enabled: true
